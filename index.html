                <style>
                        :root { --bg-primary: #0a0e17; --bg-secondary: #131b2e; --bg-card: #1c273e; --accent-cyan: #00f2fe; --accent-blue: #4facfe; --accent-green: #00e676; --accent-purple: #7c4dff; --accent-orange: #ff9100; --text-primary: #f0f4f8; --text-secondary: #94a3b8; --border-color: #2e3d5c; }
                                * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
                                        body { background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; padding-bottom: 50px; }

                                                                                                                                        .tab-btn { background: none; border: none; color: var(--text-secondary); padding: 14px 18px; font-size: 0.92rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
                                                                                                                                                .tab-btn:hover, .tab-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); background: rgba(0, 242, 254, 0.05); }
                                                                                                                                                        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
                                                                                                                                                                .tab-content { display: none; }
                                                                                                                                                                        .tab-content.active { display: block; }
                                                                                                                                                                                .phase-header { background: linear-gradient(90deg, var(--bg-secondary), var(--bg-card)); padding: 18px 25px; border-radius: 10px; margin-top: 25px; border-left: 5px solid var(--accent-cyan); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
                                                                                                                                                                                        .phase-header h2 { font-size: 1.25rem; }
                                                                                                                                                                                                .week-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; margin: 15px 0 15px 15px; padding: 20px; }
                                                                                                                                                                                                        .week-card h3 { color: var(--accent-cyan); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
                                                                                                                                                                                                                .checkbox-custom { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-green); }
                                                                                                                                                                                                                        .meta-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; margin-right: 8px; margin-bottom: 8px; }
                                                                                                                                                                                                                                .tag-free { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
                                                                                                                                                                                                                                        .tag-paid { background: rgba(255, 145, 0, 0.15); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
                                                                                                                                                                                                                                                .tag-cert { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
                                                                                                                                                                                                                                                        .tag-practice { background: rgba(124, 77, 255, 0.15); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
                                                                                                                                                                                                                                                                .tag-git { background: rgba(240, 80, 50, 0.15); color: #f05032; border: 1px solid #f05032; }
                                                                                                                                                                                                                                                                        .topic-group { margin: 10px 0; }
                                                                                                                                                                                                                                                                                .topic-group h4 { font-size: 0.92rem; color: var(--accent-blue); margin-bottom: 3px; }
                                                                                                                                                                                                                                                                                        .topic-group p { font-size: 0.88rem; color: var(--text-secondary); }
                                                                                                                                                                                                                                                                                                .study-link { display: inline-block; margin-top: 8px; color: var(--accent-cyan); text-decoration: none; font-weight: 600; font-size: 0.88rem; }
                                                                                                                                                                                                                                                                                                        .study-link:hover { text-decoration: underline; }
                                                                                                                                                                                                                                                                                                                pre { background: #0d1527; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; font-family: monospace; font-size: 0.85rem; color: var(--accent-cyan); margin-top: 10px; }
                                                                                                                                                                                                                                                                                                                        .badge { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
                                                                                                                                                                                                                                                                                                                            </style>
